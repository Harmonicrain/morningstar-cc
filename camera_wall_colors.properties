# Camera wall colour overrides.
#
# Maps a room's wallpaint id (the catalog `wallpaper` furni's extradata, e.g. "0", "101", "108")
# to the RGB colour the camera renderer should use as the wall fill in photos and thumbnails.
# Format: <wallpaintId>=0xRRGGBB
#
# Wallpaints not listed here fall back to:
#   1. sampling the dominant colour of the wall texture sprite named in the camera JSON, then
#   2. a neutral grey (#B6B6B6) if no asset can be sampled.
#
# Example:
# 101=0x8899AA
